name: Android CI

# Phase 22: CI/CD & Build Pipelines
# ---------------------------------
# Pipeline stages:
#   1. static-analysis  -> Android Lint, detekt, ktlintCheck
#   2. unit-tests       -> ./gradlew test + HTML report artifact
#   3. build-debug      -> assembleDebug (runs on every push/PR)
#   4. build-release    -> assembleRelease + bundleRelease, signed with
#                          keystore materialized from GitHub Secrets.
#                          Runs on pushes to main and on tags only.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64   base64-encoded release .jks / .keystore
#   RELEASE_KEYSTORE_PASSWORD keystore password
#   RELEASE_KEY_ALIAS         key alias inside the keystore
#   RELEASE_KEY_PASSWORD      password for that key alias

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  static-analysis:
    name: Static Analysis (lint / detekt / ktlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: ktlintCheck
        run: ./gradlew ktlintCheck --stacktrace

      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lint --stacktrace

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/ktlint/**
            app/build/reports/detekt/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-html
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-xml
          path: app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
      name: Build Release APK & Bundle
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      runs-on: ubuntu-latest
      needs: [ static-analysis, unit-tests ]
      steps:
          -   name: Checkout
              uses: actions/checkout@v4

          -   name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '17'

          -   name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      ~/.gradle/jdks
                  key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
                  restore-keys: |
                      gradle-${{ runner.os }}-

          -   name: Grant execute permission to gradlew
              run: chmod +x ./gradlew

          -   name: Optional release keystore setup
              env:
                  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
              run: |
                  if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
                    echo "Keystore secret detected. Decoding..."
                    mkdir -p "$RUNNER_TEMP/signing"
                    echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"
                    echo "POCKETPILOT_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"
                  else
                    echo "No keystore secret found. Building unsigned release artifacts."
                  fi

          -   name: assembleRelease + bundleRelease
              env:
                  POCKETPILOT_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
                  POCKETPILOT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
                  POCKETPILOT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
              run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

          -   name: Wipe decoded keystore
              if: always()
              run: rm -f "$RUNNER_TEMP/signing/release.keystore"

          -   name: Upload release APK
              uses: actions/upload-artifact@v4
              with:
                  name: pocketpilot-release-apk
                  path: app/build/outputs/apk/release/*.apk
                  if-no-files-found: error
                  retention-days: 30

          -   name: Upload release AAB
              uses: actions/upload-artifact@v4
              with:
                  name: pocketpilot-release-aab
                  path: app/build/outputs/bundle/release/*.aab
                  if-no-files-found: error
                  retention-days: 30
